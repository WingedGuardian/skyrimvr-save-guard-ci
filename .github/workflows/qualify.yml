name: Save guard qualification

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gateway-guard:
    name: Save guard (${{ matrix.os }}, Python 3.10)
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Support exact captured Windows paths
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.10"
      - name: Install locked dependencies
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r requirements.lock
      - name: Exact packet policy and preservation checks
        run: python gateway_guard/qualify.py
      - name: Reviewed inert fixture candidate and existing policy regressions
        run: python -B inert_fixture_guard/qualify.py
      - name: Native adapter bytecode flag and retained policy regressions
        run: python -B native_adapter_guard/qualify.py
      - name: Contextual read-only classification and retained preservation controls
        run: python -E -s -B -X pycache_prefix=readonly_classifier_guard/no-pyc readonly_classifier_guard/qualify.py
      - name: Reviewed controller freeze exemption and retained controls
        run: python -E -s -B -X pycache_prefix=controller_freeze_guard/no-pyc controller_freeze_guard/qualify.py
